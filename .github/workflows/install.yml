name: install

on:
  push:
    paths:
    - 'cvehound/**/*.py'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'MANIFEST.in'
    - 'README.md'
    - '.github/workflows/install.yml'
  pull_request:
    paths:
    - 'cvehound/**/*.py'
    - 'pyproject.toml'
    - 'uv.lock'
    - 'MANIFEST.in'
    - 'README.md'
    - '.github/workflows/install.yml'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Install uv with Python 3.11
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: "3.11"
        enable-cache: true

    - name: Install CVEhound (locked, runtime deps only)
      run: uv sync --locked --no-dev

    - name: Smoke test
      run: |
        uv run cvehound --help
        uv run cvehound --version
        uv run python -m cvehound --version
