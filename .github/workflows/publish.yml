# Publishes the package to PyPI using uv + Trusted Publishing (OIDC).
# Requires a one-time PyPI-side setup: add a trusted publisher at
# https://pypi.org/manage/project/cvehound/settings/publishing/
# with owner=linux-analysis, repository=cvehound, workflow=publish.yml,
# environment=pypi.

name: Upload Python Package

on:
  release:
    types: [published]

jobs:
  deploy:
    # The rolling content-latest prerelease is a content carrier, not a
    # software release: publishing it fires this event too.
    if: github.event.release.tag_name != 'content-latest'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.11"

      # The metadata blob is not git-tracked: the wheel's baseline copy comes
      # from the content-latest release (published by content.yml), verified
      # and placed by cvehound.content itself so the manifest schema has a
      # single implementation.
      - name: Fetch the content baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download content-latest --pattern manifest.json --pattern kernel_cves.json.gz --dir content-dl; then
            uv run python -c "
          import hashlib, os, shutil, sys
          from cvehound.content import CONTENT_ID_NAME, METADATA_NAME, load_manifest
          manifest = load_manifest('content-dl/manifest.json')
          blob = 'content-dl/kernel_cves.json.gz'
          with open(blob, 'rb') as fh:
              digest = hashlib.sha256(fh.read()).hexdigest()
          if digest != manifest['metadata']['sha256']:
              sys.exit('metadata blob checksum mismatch')
          # Nothing under cvehound/data/ is git-tracked, so a fresh checkout
          # has no such directory to copy into.
          os.makedirs('cvehound/' + os.path.dirname(METADATA_NAME), exist_ok=True)
          shutil.copyfile(blob, 'cvehound/' + METADATA_NAME)
          with open('cvehound/' + CONTENT_ID_NAME, 'w') as fh:
              fh.write(manifest['content_id'] + '\n')
          "
          elif [[ -f cvehound/data/kernel_cves.json.gz ]]; then
            echo 'Bootstrap: building with the in-repo metadata blob'
          else
            echo 'No metadata blob available for the release build' >&2
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build --no-sources

      - name: Publish to PyPI
        run: uv publish
