name: test

on:
  push:
    paths:
    - 'cvehound/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - '.github/workflows/test.yml'
  pull_request:
    paths:
    - 'cvehound/**'
    - 'tests/**'
    - 'pyproject.toml'
    - 'uv.lock'
    - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      runslow:
        description: 'Run the slow suite (every rule across its Fixes..Fix range)'
        type: boolean
        default: false
      cves:
        description: 'With runslow, limit it to these CVEs (space separated). Empty runs all.'
        type: string
        default: ''
  schedule:
    - cron: '0 0 * * MON'

env:
  STABLE_BRANCHES: ("linux-6.18.y" "linux-6.12.y" "linux-6.6.y" "linux-6.1.y" "linux-5.15.y" "linux-5.10.y")

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        ocaml-version: [4.11.2]
        # The floor we support (1.1.0), whatever the distro ships, the spatch
        # cvehound bundles itself, and today's upstream tip.
        coccinelle-version: [1.1.0, system, bundled, git]
        # One python per coccinelle version. These entries only add a key to an
        # already existing combination, so the matrix stays at 4 jobs. Pytest runs
        # on the requires-python floor (3.11) everywhere except one job on 3.14,
        # which defaults to the forkserver start method on Linux and covers the
        # CLI pool path under it (see tests/test_10_cli.py).
        include:
        - coccinelle-version: 1.1.0
          python-version: "3.11"
        - coccinelle-version: system
          python-version: "3.11"
        - coccinelle-version: bundled
          python-version: "3.14"
        - coccinelle-version: git
          python-version: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Get Date
      id: date
      run: echo "date=$(date +'%Y-%m')" >> $GITHUB_OUTPUT

    - name: Install uv with Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v10.3.2
      with:
        python-version: ${{ matrix.python-version }}
        enable-cache: true

    - name: Update Apt-Get Index
      run: sudo apt-get update -qq

    - name: Install system Coccinelle with apt
      if: ${{ matrix.coccinelle-version == 'system' }}
      run: |
        sudo apt-get install -y coccinelle

    - name: Setup Opam
      if: ${{ matrix.coccinelle-version != 'system' && matrix.coccinelle-version != 'bundled' }}
      uses: ocaml/setup-ocaml@v3
      with:
        ocaml-compiler: ${{ matrix.ocaml-version }}
        opam-disable-sandboxing: true
        cache-prefix: ${{ matrix.coccinelle-version }}

    - name: Install Coccinelle with opam (${{ matrix.coccinelle-version }})
      if: ${{ !contains(fromJSON('["system", "bundled", "git"]'), matrix.coccinelle-version) }}
      run: opam install -y coccinelle.${{ matrix.coccinelle-version }}

    - name: Clone Coccinelle
      uses: actions/checkout@v7
      if: ${{ matrix.coccinelle-version == 'git' }}
      with:
        repository: coccinelle/coccinelle
        path: coccinelle

    - name: Install latest Coccinelle from git
      if: ${{ matrix.coccinelle-version == 'git' }}
      run: |
        eval $(opam env)
        cd coccinelle
        opam install -y .

    - name: Spatch Version
      if: ${{ matrix.coccinelle-version != 'bundled' }}
      run: |
        which opam >/dev/null 2>&1 && eval $(opam env)
        spatch --version
        spatch_version="$(spatch --version | head -1)"
        if [[ ${{ matrix.coccinelle-version }} != 'system' && ${{ matrix.coccinelle-version }} != 'git' ]]; then
          spatch_major_version="$(echo ${{ matrix.coccinelle-version }} | cut -d '.' -f 1-2)"
          if [[ "$spatch_version" != "spatch version ${{ matrix.coccinelle-version }}"* && "$spatch_version" != "spatch version ${spatch_major_version} "* ]]; then
            echo "Wrong coccinelle version installed" >&2
            exit 1
          fi
        fi

    - name: Install CVEhound
      run: uv sync --locked ${{ matrix.coccinelle-version == 'bundled' && '--extra spatch' || '' }}

    # Nothing installed a system spatch in this job, so this also proves that
    # find_spatch() reaches the sidecar package rather than PATH.
    - name: Bundled Spatch Version
      if: ${{ matrix.coccinelle-version == 'bundled' }}
      run: |
        ! command -v spatch || { echo "a system spatch leaked into this job" >&2; exit 1; }
        uv run python -c "from cvehound.util import find_spatch; print(find_spatch())"
        uv run python -m cvehound_spatch --version

    - name: Restore Linux Repository
      id: linux-cache
      uses: actions/cache/restore@v6
      with:
        path: tests/linux/.git
        key: linux-git-v1-${{ steps.date.outputs.date }}
        # A new month tops up last month's objects with a fetch instead of
        # re-downloading the 3.4 GB clone bundle.
        restore-keys: |
          linux-git-v1-

    - name: Download Linux Tree
      run: |
        if [[ ! -d tests/linux/.git ]]; then
          curl --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 --continue-at - \
            --output clone.bundle \
            https://mirrors.edge.kernel.org/pub/scm/.bundles/pub/scm/linux/kernel/git/stable/linux/clone.bundle
          git clone --no-checkout clone.bundle tests/linux
          rm -f clone.bundle
        fi
        cd tests/linux
        git config gc.auto 0
        git remote set-url origin https://github.com/torvalds/linux.git
        git remote set-branches origin master
        if git remote get-url next >/dev/null 2>&1; then
          git remote set-url next https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
        else
          git remote add --no-tags next https://git.kernel.org/pub/scm/linux/kernel/git/next/linux-next.git
        fi
        git remote set-branches next master
        stable=${{env.STABLE_BRANCHES}}
        if git remote get-url stable >/dev/null 2>&1; then
          git remote set-url stable https://github.com/gregkh/linux.git
        else
          git remote add --no-tags stable https://github.com/gregkh/linux.git
        fi
        git remote set-branches stable ${stable[@]}
        # One negotiation for master plus the mainline tags: the clone bundle
        # is only downloaded on a fully cold cache and restore-keys keep the
        # cache warm forever, so without the tag refspec the newest tags
        # test_05's tags mode iterates would freeze at the bundle's date.
        git fetch --no-tags origin master '+refs/tags/v*:refs/tags/v*'
        git fetch --no-tags next
        git fetch --no-tags stable
        # CVE-2019-18680 was introduced and fixed on linux-4.4.y alone, so its
        # Fix: and Fixes: are on no branch above. The clone bundle used to carry
        # every stable branch and tag; since kernel.org trimmed it to the live
        # ones (2026-09), a cold cache has to fetch the branch itself. The
        # v4.4.* tags are test_05's tags-mode points inside that rule's range.
        git fetch --no-tags stable '+refs/heads/linux-4.4.y:refs/remotes/stable/linux-4.4.y' \
          '+refs/tags/v4.4.*:refs/tags/v4.4.*'
        git reset --hard origin/master
        cd -
        # Same git tuning the test suite applies (parallel checkout, index v4,
        # Bloom commit-graph); running it here bakes the ~80s one-time graph
        # write into the .git cache saved below instead of repaying it in
        # every pytest run.
        uv run python -c "import sys; sys.path.insert(0, 'tests'); \
          from git import Repo; from conftest import _tune_repo; \
          _tune_repo(Repo('tests/linux'))"

    - name: Save Linux Repository
      if: steps.linux-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: tests/linux/.git
        key: linux-git-v1-${{ steps.date.outputs.date }}

    - name: Restore Result Cache
      uses: actions/cache/restore@v6
      with:
        path: tests/.result_cache
        key: results-v1-${{ matrix.coccinelle-version }}-${{ github.run_id }}
        restore-keys: |
          results-v1-${{ matrix.coccinelle-version }}-

    - name: Test with pytest
      env:
        # The workflow just fetched everything the run needs; make conftest's
        # fetch skip declarative instead of relying on FETCH_HEAD's age.
        CVEHOUND_TEST_OFFLINE: 1
        # Only push events carry a before/after pair. schedule,
        # workflow_dispatch and pull_request leave these empty, a new branch
        # sends the all-zero SHA, and a force-push can leave BEFORE
        # unreachable -- each falls back to the full suite below.
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
        # The slow suite is the only thing that exercises every rule against
        # every tag in its range, so it is the only way to see this matrix's
        # older coccinelle builds do it. Nothing schedules that -- dispatch it.
        RUNSLOW: ${{ inputs.runslow }}
        DISPATCH_CVES: ${{ inputs.cves }}
      run: |
        sudo setcap cap_sys_nice,cap_sys_admin+eip $(realpath $(which python3))
        which opam >/dev/null 2>&1 && eval $(opam env)
        CHANGED=''
        if git rev-parse --verify --quiet "${PUSH_BEFORE}^{commit}" >/dev/null &&
           git rev-parse --verify --quiet "${PUSH_AFTER}^{commit}" >/dev/null; then
          CHANGED=$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER")
        fi
        readarray RULES < <(echo "$CHANGED" | grep -o 'CVE-[[:digit:]]*-[[:digit:]]*' | sort -u)
        NONRULE=$(echo "$CHANGED" | grep -v '^cvehound/cve/' | grep -c . || true)
        # The per-rule fast path only fits pushes that touch nothing but
        # rules: --cve now deselects the harness unit tests, so a push that
        # also changes harness or package code must take the full suite.
        if [[ $RUNSLOW == true ]]; then
          # The whole slow suite is hours at -n 2, and does not fit a 6h job;
          # naming the rules is how you ask one question of it -- e.g. do the
          # heaviest whole-tree scans stay inside SPATCH_WALL_TIMEOUT on a runner
          # rather than a workstation. Empty expands to no --cve, i.e. all rules.
          uv run pytest --runslow -n 2 $(for c in $DISPATCH_CVES; do echo " --cve=$c "; done)
        elif [[ -n $CHANGED && ${#RULES[@]} -gt 0 && ${#RULES[@]} -le 5 && $NONRULE -eq 0 ]]; then
          uv run pytest --runslow -n 2 $(for rule in ${RULES[@]}; do echo " --cve=$rule "; done)
        else
          uv run pytest -n 2
        fi

    - name: Save Result Cache
      if: always()
      uses: actions/cache/save@v6
      with:
        path: tests/.result_cache
        key: results-v1-${{ matrix.coccinelle-version }}-${{ github.run_id }}
