[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cvehound"
version = "1.7.0"
description = "A tool to check linux kernel source dump for known CVEs"
readme = "README.md"
license = {text = "GPLv3"}
authors = [{name = "Denis Efremov", email = "efremov@linux.com"}]
requires-python = ">=3.11"
keywords = ["cve", "linux", "kernel", "spatch", "cve-scanning", "coccinelle"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["pyyaml"]

# Ships a tailored spatch so that coccinelle need not be installed separately;
# find_spatch() picks it up automatically. The marker lists exactly the
# platforms the sidecar publishes wheels for -- everywhere else cvehound falls
# back to the spatch on PATH, and pip must not be asked for a wheel that does
# not exist. One requirement rather than one per platform, so the version floor
# below stays stated once.
[project.optional-dependencies]
# >=1.3.3.post1 is the first build whose zygote speaks protocol v2, the only one
# cvehound's client reads. An older wheel still works: its zygote fails the
# first request and the scan falls back to one process per rule.
spatch = [
    "cvehound-spatch>=1.3.3.post1; (sys_platform == 'linux' and platform_machine in 'x86_64 aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]
# cvehound.oracle is shipped API: BlobMaterializer works over a GitPython Repo
# and ResultCache.compact() takes a cross-process file lock. The scanner itself
# needs neither, so they stay behind an extra instead of runtime dependencies.
oracle = ["gitpython", "filelock"]

[project.scripts]
cvehound = "cvehound.__main__:main"
cvehound_update_metadata = "cvehound.scripts.update_metadata:main"

[project.urls]
Homepage = "https://github.com/linux-analysis/cvehound"

[dependency-groups]
dev = [
    {include-group = "test"},
    {include-group = "lint"},
]
test = ["pytest", "pytest-xdist", "filelock", "gitpython", "psutil"]
lint = [
    "ruff>=0.15.10",
    "ty>=0.0.29",
    "pre-commit>=4.0",
]

# Package data (cvehound/cve/*, cvehound/data/*) ships via MANIFEST.in plus
# setuptools' pyproject-mode include_package_data default.
[tool.setuptools.packages.find]
include = ["cvehound", "cvehound.*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
    "E501",
    "ANN401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"cvehound/kbuild.py" = ["ANN"]
"cvehound/kbuildparse/**" = ["ANN"]

[tool.ruff.format]
quote-style = "single"

[tool.ty.environment]
python-version = "3.11"
python-platform = "linux"

[tool.ty.src]
include = ["cvehound"]
exclude = [
    "tests",
    "build",
    "dist",
    "cvehound.egg-info",
    "cvehound/kbuild.py",
    "cvehound/kbuildparse",
]
